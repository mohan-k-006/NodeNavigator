services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav
      POSTGRES_DB: nav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: